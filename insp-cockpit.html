<div class="dashboard">
  <div class="header">
    <div class="sub">报检取样 · 检验项完成监控</div>

<script>
const MOCK = window.WMS_MOCK_ROWS || {};
try{ if(window.WMS_DEMO_STORE && window.WMS_DEMO_STORE.hydrateMock) window.WMS_DEMO_STORE.hydrateMock(MOCK); }catch(e){}

/* ---------- 基础工具 ---------- */
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const p2 = n => String(n).padStart(2,'0');
function dayOf(v){ const s = String(v||'').trim(); const m = s.match(/^(\d{4}-\d{2}-\d{2})/); return m ? m[1] : ''; }
function ts(v){ const t = Date.parse(String(v||'').replace(/-/g,'/')); return isNaN(t) ? 0 : t; }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate()); }
function fmtDur(ms){
  const mins = Math.floor(ms/60000), d = Math.floor(mins/1440), h = Math.floor((mins%1440)/60), m = mins%60;
  return (d?d+'天':'') + (h?(d?' ':'')+h+'小时':'') + ((!d&&!h)||m ? ((d||h)?' ':'')+m+'分钟' : '');
}
const NOW = Date.now();
const TODAY = new Date(); const TODAY_S = TODAY.getFullYear()+'-'+p2(TODAY.getMonth()+1)+'-'+p2(TODAY.getDate());

/* ---------- 样品数据：五个页签 ---------- */
const TABS = [['tab-pi','采购来料检'],['tab-pp','生产过程检'],['tab-pm','生产物料检'],['tab-sst','生产SST检'],['tab-rd','研发检'],['tab-ext','外来小样检'],['tab-wr','库内复检'],['tab-ty','通用检'],['tab-oe','内部委托']];
const ledger = MOCK.ledger || {};
const orderEta = {};
[['tab-pi'],['tab-pp'],['tab-pm'],['tab-sst'],['tab-rd']].forEach(([t])=>{
  ((MOCK['insp-order']||{})[t]||[]).forEach(o2=>{ const v=ts(o2['预计完成时间']); if(v && o2['报检单号']) orderEta[o2['报检单号']]=v; });
});
/* 单项状态：按该项检验结论——不合格/合格已定；检验中样品下无结论项=进行中；待检验=未检 */
function itemState(s, it){
  if(it['检验结论']==='不合格') return 'bad';
  if(it['检验结论']==='合格') return 'done';
  if(s['样品状态']==='检验中') return 'run';
  if(s['样品状态']==='已完成') return 'done';
  return 'wait';
}
const samples = TABS.flatMap(([name,label]) => ((ledger[name])||[]).map(r => {
  // 与台账「检验详情」同一套推导：全部样品都有检验项（ledgerInspItems）；待检验项未检、检验中部分有结果、已完成全有结果
  const items = window.WMS_LEDGER_INSP ? WMS_LEDGER_INSP.ledgerInspItems(r) : (Array.isArray(r._insp)?r._insp:[]);
  const total = items.length;
  const done = items.filter(it => itemState(r,it)==='done' || itemState(r,it)==='bad').length;
  const bad  = items.filter(it => itemState(r,it)==='bad').length;
  const run  = items.filter(it => itemState(r,it)==='run').length;
  const eta = ts(r['预计完成时间']) || ts(orderEta[r['报检单号']]);
  const active = r['样品状态']==='待检验' || r['样品状态']==='检验中';
  const overdue = !!(eta && NOW > eta);
  return Object.assign({}, r, { 报检类型:label, _items:items, _total:total, _done:done, _bad:bad, _run:run, _eta:eta, _active:active, _overdue:overdue });
}));

/* ---------- 页头全局筛选：时间范围（起止日期，默认当天~当天，按取样时间）+ 检验类型（默认所有） ---------- */
const FLT = { start:TODAY_S, end:TODAY_S, types:new Set() };
function fltPool(){
  return samples.filter(s=>{
    if(FLT.types.size && !FLT.types.has(s['报检类型'])) return false;
    const d = dayOf(s['取样时间']);
    if(FLT.start && (!d || d<FLT.start)) return false;
    if(FLT.end && (!d || d>FLT.end)) return false;
    return true;
  });
}

/* ---------- 检验项 KPI + 进度 ---------- */
function renderItemKpis(){
  const pool = fltPool();
  let clsTotal = 0, clsDone = 0, clsRun = 0, clsBad = 0;
  pool.forEach(s=>{
    const m = {};
    (s._items||[]).forEach(it=>{
      const c = it['所属检验类'] || '未分类';
      const a = m[c] || (m[c] = { n:0, done:0, bad:0 });
      a.n++;
      const k = itemState(s, it);
      if(k==='done') a.done++;
      else if(k==='bad'){ a.done++; a.bad++; }
    });
    Object.values(m).forEach(a=>{
      clsTotal++;
      if(a.done===a.n) clsDone++; else clsRun++;
      if(a.bad) clsBad++;
    });
  });
  const rate = clsTotal ? (clsDone/clsTotal*100).toFixed(1)+'%' : '—';
  $('item-kpis').innerHTML =
    `<div class="item-kpi ik-blue"><div class="ik-label">检验类任务</div><div class="ik-num">${clsTotal}<span style="font-size:11px;opacity:.55"> 个</span></div><div class="ik-sub">口径：在制样品检验类合计</div></div>`+
    `<div class="item-kpi ik-cyan"><div class="ik-label">检验类完成率</div><div class="ik-num">${rate}</div><div class="ik-sub">完成 ${clsDone} · 进行 ${clsRun} / 任务 ${clsTotal}</div></div>`+
    `<div class="item-kpi ik-red"><div class="ik-label">不合格类</div><div class="ik-num">${clsBad}<span style="font-size:11px;opacity:.55"> 个</span></div><div class="ik-sub">触发：类下出现不合格项</div></div>`;
}
/* 检验项完成进度：按检验项「所属检验类」聚合；面板只展示「未完成样品（待检验+检验中）」里出现的检验类并集，进度数字仍按筛选内全部样品统计 */
let progList = [];
function renderProg(){
  const pool = fltPool();
  const itemStats = {};
  pool.forEach(s=> (s._items||[]).forEach(it=>{
    const n = it['所属检验类'] || '未分类';
    const st = itemStats[n] || (itemStats[n] = { name:n, total:0, done:0, run:0, bad:0 });
    st.total++;
    const k = itemState(s, it);
    if(k==='done') st.done++;
    else if(k==='bad'){ st.done++; st.bad++; }
    else if(k==='run') st.run++;
  }));
  const pendingCls = new Set();
  pool.filter(s=> s['样品状态']!=='已完成').forEach(s=> (s._items||[]).forEach(it=> pendingCls.add(it['所属检验类']||'未分类')));
  progList = Object.values(itemStats).sort((a,b)=> b.total-a.total || b.done-a.done).filter(st=> pendingCls.has(st.name));
  $('prog-list').innerHTML = progList.map(st=>{
    const pct = st.total ? Math.round(st.done/st.total*100) : 0;
    const parts = [`任务 ${st.total}`, `完成 ${st.done}`];
    if(st.run) parts.push(`进行 ${st.run}`);
    if(st.bad) parts.push(`不合格 ${st.bad}`);
    return `<div class="prog-row" data-item="${esc(st.name)}"><div class="prog-head"><b title="${esc(st.name)}">${esc(st.name)}</b><span class="prog-pct">${pct}%</span></div><div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div><div class="prog-meta">${parts.join(' · ')}</div></div>`;
  }).join('') || '<div class="empty-tip">暂无数据</div>';
  $('prog-list').querySelectorAll('.prog-row').forEach(el=> el.onclick = ()=> openItemSamples(el.dataset.item));
}

/* ---------- 样品看板 ---------- */
const KB_CHIPS = ['全部','待检','检验中','已完成','逾期'];
let kbChip = '全部';
function chipHit(s, chip){
  if(chip==='待检') return s['样品状态']==='待检验';
  if(chip==='检验中') return s['样品状态']==='检验中';
  if(chip==='已完成') return s['样品状态']==='已完成';
  if(chip==='逾期') return s._overdue;
  return true;
}
function statusTag(s){ return s['样品状态']==='已完成' ? 'tag-done' : (s['样品状态']==='检验中' ? 'tag-run' : 'tag-wait'); }
function kbFiltered(chip){
  const mq = (($('kb-mat')||{}).value||'').trim();
  const kq = (($('kb-kind')||{}).value||'');
  return fltPool().filter(s=> chipHit(s,chip) && (!mq || String(s['物料编码']||'').includes(mq)) && (!kq || s['物料种类']===kq));
}
function renderKb(){
  $('kb-chips').innerHTML = KB_CHIPS.map(c=>{
    const n = kbFiltered(c).length;

  }).join('');

    return;
  }
  const cards = rows.map(s=>{

    const odTag = s._eta ? (s._overdue ? '<span class="tag tag-fail">逾期</span>' : '<span class="tag tag-done">正常</span>') : '';
    const tag = `<span class="tag ${statusTag(s)}">${esc(s['样品状态'])}</span>${odTag}`;
    const clsMap = {};
    (s._items||[]).forEach(it=>{
      const c = it['所属检验类'] || '未分类';
      const st = itemState(s, it);
      const cur = clsMap[c];
      const rank = {bad:3, run:2, wait:1, done:0};
      if(cur==null || rank[st] > rank[cur]) clsMap[c] = st;
    });
    const chips = Object.keys(clsMap).map(c=> `<span class="kc-chip-i ci-${clsMap[c]}">${esc(c)}</span>`).join('');
    return `<div class="kb-card" data-id="${esc(s.id)}"><div class="kc-no"><span>${esc(s['样品编号'])}</span>${tag}</div>`+

      `<div class="kc-prog"><div class="kc-bar"><i style="width:${pct}%"></i></div><span class="kc-txt">${pct}%</span></div>`+

  }).join('');
  /* 样品多时自动滚动：复制一份内容做 -50% 无缝循环，悬停暂停 */
  if(rows.length > 16){
    track.className = 'kb-track scrolling';

  }

/* ---------- 近7日趋势（以数据最新日期为基准） ---------- */
const charts = {};
function mkChart(id, opt){
  if(!window.echarts) return;
  if(!charts[id]) charts[id] = echarts.init($(id));
  charts[id].setOption(Object.assign({grid:{left:40,right:16,top:28,bottom:26},textStyle:{color:'#475569'}}, opt));
}
const CARD_RANGES = { done:{}, recv:{} };
const CARD_DIM = { done:'day', recv:'day' };
function cardRange(k){
  const r = CARD_RANGES[k] || {};
  return { start: r.start || FLT.start, end: r.end || FLT.end };
}
function syncCardRanges(){
  Object.keys(CARD_RANGES).forEach(k=>{
    CARD_RANGES[k] = { start: FLT.start, end: FLT.end };
    const a = $('rg-'+k+'-a'), b = $('rg-'+k+'-b');
    if(a) a.value = FLT.start || '';
    if(b) b.value = FLT.end || '';
  });
}
function typedPool(){
  return samples.filter(s=> !FLT.types.size || FLT.types.has(s['报检类型']));
}
function rangeRows(dateKey, rng, dim){
  const pool = typedPool();
  const arr = [];
  if(!rng.start || !rng.end) return arr;
  const inRange = d => d>=rng.start && d<=rng.end;
  const count = dy => pool.filter(s=>{
    const d = dayOf(s[dateKey]);
    return d && inRange(d) && dy(d) && (dateKey!=='检验完成时间' || s['样品状态']==='已完成');
  }).length;
  dim = dim || 'day';
  if(dim==='day'){
    const n = Math.round((Date.parse(rng.end.replace(/-/g,'/')) - Date.parse(rng.start.replace(/-/g,'/'))) / 86400000);
    for(let i=0;i<=n;i++){
      const d = addDays(rng.start, i);
      arr.push({ label:d.slice(5), n: count(dy=>dy===d) });
    }
    return arr;
  }
  if(dim==='week'){
    const d = new Date(rng.start.replace(/-/g,'/')), e = new Date(rng.end.replace(/-/g,'/'));
    d.setDate(d.getDate() - ((d.getDay()+6)%7));
    while(d<=e){
      const k = d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
      const k2 = Date.parse(k.replace(/-/g,'/'));
      arr.push({ label:k.slice(5)+'周', n: count(dy=>{ const t=Date.parse(dy.replace(/-/g,'/')); return t>=k2 && t<k2+7*86400000; }) });
      d.setDate(d.getDate()+7);
    }
    return arr;
  }
  const ms = [], [y1,m1] = rng.start.split('-').map(Number), [y2,m2] = rng.end.split('-').map(Number);
  for(let y=y1,m=m1; y<y2 || (y===y2 && m<=m2); ){ ms.push(y+'-'+p2(m)); if(++m>12){m=1;y++;} }
  ms.forEach(ym=> arr.push({ label:ym.slice(2).replace('-','/'), n: count(dy=>dy.slice(0,7)===ym) }));
  return arr;
}
function renderCharts(){
  const done = rangeRows('检验完成时间', cardRange('done'), CARD_DIM.done);
  mkChart('chart-done',{ tooltip:{trigger:'axis',backgroundColor:'#fff',borderColor:'#e2e8f0',textStyle:{color:'#334155',fontSize:11}},
    xAxis:{type:'category',data:done.map(r=>r.label),axisLine:{lineStyle:{color:'#cbd5e1'}},axisLabel:{fontSize:10,color:'#64748b'}},
    yAxis:{type:'value',minInterval:1,splitLine:{lineStyle:{color:'#f1f5f9'}},axisLabel:{fontSize:10,color:'#94a3b8'}},
    dataZoom: done.length>24 ? [{type:'slider',height:12,bottom:2}] : [],
    series:[{type:'line',data:done.map(r=>r.n),smooth:true,symbolSize:5,lineStyle:{color:'#2563eb',width:2.5},itemStyle:{color:'#2563eb'},areaStyle:{color:'rgba(37,99,235,.08)'},label:{show:done.length<=31,fontSize:9,color:'#2563eb'}}]
  });
  const recv = rangeRows('取样时间', cardRange('recv'), CARD_DIM.recv);
  mkChart('chart-recv',{ tooltip:{trigger:'axis',backgroundColor:'#fff',borderColor:'#e2e8f0',textStyle:{color:'#334155',fontSize:11}},
    xAxis:{type:'category',data:recv.map(r=>r.label),axisLine:{lineStyle:{color:'#cbd5e1'}},axisLabel:{fontSize:10,color:'#64748b'}},
    yAxis:{type:'value',minInterval:1,splitLine:{lineStyle:{color:'#f1f5f9'}},axisLabel:{fontSize:10,color:'#94a3b8'}},
    dataZoom: recv.length>24 ? [{type:'slider',height:12,bottom:2}] : [],
    series:[{type:'bar',data:recv.map(r=>r.n),barWidth:'46%',itemStyle:{color:'#60a5fa',borderRadius:[3,3,0,0]},label:{show:recv.length<=31,position:'top',fontSize:9,color:'#2563eb'}}]
  });
}

/* ---------- 样品位置（与质量数字驾驶舱同源：np-0201-12 样品位置页） ---------- */
function slocBucket(r, disposed){
  if(disposed) return r['处置方式']==='留样' ? '留样' : '已报废';
  const pos = String(r['当前位置']||'').trim();
  if(!pos || pos==='—') return '未入库';
  if(pos.indexOf('货架')>=0) return '样品货架';
  if(pos.indexOf('筐')>=0) return '样品筐';
  return '领用中';
}
function renderLoc(){
  const bag = MOCK['np-0201-12'] || {};
  const groups = {未入库:[], 样品货架:[], 样品筐:[], 领用中:[], 留样:[], 已报废:[]};
  (bag['tab-1']||[]).forEach(r=>{
    if(FLT.types.size && !FLT.types.has(r['报检类型'])) return;
    const key = slocBucket(r, false);
    groups[key].push({cat:key, no:r['样品编号'], io:r['报检单号'], mat:r['物料名称'], pos:(!r['当前位置']||r['当前位置']==='—')?'未入库':r['当前位置'], type:r['报检类型'], person:r['最近变更人'], time:r['最近变更时间']});
  });
  (bag['tab-2']||[]).forEach(r=>{
    if(FLT.types.size && !FLT.types.has(r['报检类型'])) return;
    const key = slocBucket(r, true);
    groups[key].push({cat:key, no:r['样品编号'], io:r['报检单号'], mat:r['物料名称'], pos:key==='留样'?'留样':'已报废', type:r['报检类型'], person:r['最近变更人']||r['处置人'], time:r['最近变更时间']||r['处置时间']});
  });
  const shown = [];
  const LOC_ORDER = ['未入库','样品货架','样品筐','领用中','留样','已报废'];
  /* 明细列表只取「在用」Tab（tab-1）：未入库/样品货架/样品筐/领用中，每桶最多3条 */
  LOC_ORDER.slice(0, 4).forEach(k=> groups[k].slice(0, 3).forEach(row=> shown.push(row)));
  $('loc-side').innerHTML = LOC_ORDER.map(k=>
    `<div class="loc-item"><span>${k}</span><b>${groups[k].length}</b></div>`
  ).join('');
  const track = $('sloc-track');
  if(!shown.length){
    track.className = 'scroll-track still';
    track.innerHTML = '<div class="list-row" style="display:block;color:#94a3b8;padding:16px 4px">暂无样品位置数据</div>';
    return;

  ).join('');
  track.className = shown.length > 5 ? 'scroll-track' : 'scroll-track still';
  track.innerHTML = shown.length > 5 ? html+html : html;
}


/* ---------- 明细弹窗 ---------- */
function openDlg(title, html){ $('dlg-title').textContent = title; $('dlg-body').innerHTML = html; $('dlg').classList.add('active'); }
$('dlg-close').onclick = ()=> $('dlg').classList.remove('active');
$('dlg').addEventListener('click', e=>{ if(e.target===e.currentTarget) e.currentTarget.classList.remove('active'); });
function conclTag(c){ return c==='合格' ? 'tag-pass' : (c==='不合格' ? 'tag-fail' : 'tag-gray'); }
const IT_ST = { wait:['待检','tag-wait'], run:['检验中','tag-run'], done:['已完成','tag-done'], bad:['已完成','tag-done'] };
function openSample(id){
  const s = samples.find(r=> String(r.id)===String(id)); if(!s) return;
  const items = s._items || [];
  const opUser = s['检验人'] && s['检验人']!=='—' ? s['检验人'] : '管理员';
  const odVal = !s._eta ? '—' : (s._overdue ? '逾期' : '正常');
  /* 检验类聚合：类状态=该类下检验项最劣状态（不合格>进行中>未检>已完成） */
  const rank = {bad:3, run:2, wait:1, done:0};
  const clsRows = [];
  const seen = {};
  items.forEach(it=>{
    const c = it['所属检验类'] || '未分类';
    if(!seen[c]){ seen[c] = { cls:c, st:'done', hasConcl:false, anyBad:false, allConcl:true }; clsRows.push(seen[c]); }
    const r = seen[c], st = itemState(s, it);
    if(rank[st] > rank[r.st]) r.st = st;
    if(st!=='done' && st!=='bad') r.allConcl = false;
    if(st==='bad') r.anyBad = true;
    if(st==='done'||st==='bad') r.hasConcl = true;
  });
  const clsN = clsRows.length;
  const clsDone = clsRows.filter(r=> r.st==='done'||r.st==='bad').length;
  const pct = clsN ? (clsDone/clsN*100).toFixed(1)+'%' : '—';
  const cards = [
    ['报检单号', esc(s['报检单号']||'—'), 'c-cyan'],
    ['报检类型', esc(s['报检类型']||'—'), ''],
    ['样品编号', esc(s['样品编号']||'—'), 'c-cyan'],
    ['检验类数', clsN + ' 类', 'c-cyan'],

    ['样品状态', esc(s['样品状态']), ''],

  ].map(([l,v,c])=> `<div class="sd-card ${c}"><div class="sd-label">${l}</div><div class="sd-val">${v}</div></div>`).join('');
  const body = clsRows.map((r,ix)=>{
    const [stTxt, stCls] = IT_ST[r.st];
    const c = r.allConcl ? (r.anyBad ? '不合格' : '合格') : '';
    return `<tr><td>${ix+1}</td><td>${esc(r.cls)}</td><td><span class="tag ${stCls}">${stTxt}</span></td><td>${esc(r.hasConcl ? opUser : '—')}</td><td><span class="tag ${conclTag(c)}">${esc(c||'—')}</span></td></tr>`;
  }).join('') || '<tr><td colspan="5" style="text-align:center;color:#94a3b8">无检验类明细</td></tr>';
  openDlg(`${esc(s['样品编号'])} · 样品检验项明细`,
    `<div class="sd-sub">${esc(s['报检单号']||'—')} · ${esc(s['物料名称']||'—')} · ${esc(s['报检类型'])} · 进度 ${clsDone}/${clsN} · 需求完成 ${esc(s['需求完成时间']||'—')}</div>`+
    `<div class="sd-cards">${cards}</div>`+
    `<table class="dlg-table"><thead><tr><th>序号</th><th>检验类</th><th>状态</th><th>检验员</th><th>检验结论</th></tr></thead><tbody>${body}</tbody></table>`);
}

/* 检验类 → 包含该类检验项的样品清单 */
function openItemSamples(cls){
  const rows = fltPool().filter(s=> (s._items||[]).some(it=> (it['所属检验类']||'未分类')===cls));
  rows.sort((a,b)=> (a['样品状态']==='已完成'?1:0)-(b['样品状态']==='已完成'?1:0));
  const body = rows.map(s=>{
    const its = s._items.filter(it=> (it['所属检验类']||'未分类')===cls);
    const allDone = its.every(it=>{ const k = itemState(s,it); return k==='done'||k==='bad'; });
    const odTxt = !s._eta ? '—' : (s._overdue ? '<span class="tag tag-fail">逾期</span>' : '<span class="tag tag-done">正常</span>');
    return `<tr><td>${esc(s['样品编号'])}</td><td>${esc(s['物料名称']||'—')}</td><td>${esc(s['报检类型'])}</td><td><span class="tag ${statusTag(s)}">${esc(s['样品状态'])}</span></td><td>${odTxt}</td><td><span class="tag ${allDone?'tag-done':'tag-run'}">${allDone?'已完成':'检验中'}</span></td><td>${esc(s['需求完成时间']||'—')}</td></tr>`;
  }).join('') || '<tr><td colspan="7" style="text-align:center;color:#94a3b8">暂无样品</td></tr>';
  openDlg(`检验类「${cls}」· 涉及样品 ${rows.length} 个`,
    `<table class="dlg-table"><thead><tr><th>样品编号</th><th>物料名称</th><th>报检类型</th><th>样品状态</th><th>逾期状态</th><th>该项状态</th><th>需求完成时间</th></tr></thead><tbody>${body}</tbody></table>`);
}

/* ---------- 时钟 & 初始化 ---------- */
function tickClock(){ const d = new Date(); $('clock').textContent = `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; }
tickClock(); setInterval(tickClock, 1000);
function renderAll(){
  syncCardRanges(); renderKpis(); renderItemKpis(); renderProg(); renderKb(); renderCharts(); renderLoc(); }
(function initKbFilters(){
  const kinds = [...new Set(samples.map(s=> s['物料种类']).filter(v=> v && v!=='—'))];
  $('kb-kind').innerHTML = '<option value="">物料种类（全部）</option>' + kinds.map(t=> `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  $('kb-kind').addEventListener('change', renderKb);
  $('kb-mat').addEventListener('input', renderKb);
  const typePop = $('hd-type-pop');
  typePop.innerHTML = '<div class="msel-ops"><a id="hd-type-all">全选</a><a id="hd-type-clear">清空</a></div>' +
    TABS.map(([,t])=> `<label><input type="checkbox" value="${esc(t)}"><span>${esc(t)}</span></label>`).join('');
  function hdTypeLabel(){
    const n = FLT.types.size;
    $('hd-type-btn').textContent = n===0 ? '检验类型（所有）' : (n===TABS.length ? '检验类型（全部9类）' : '检验类型（'+n+'类）');
  }
  $('hd-type-btn').addEventListener('click', e=>{ e.stopPropagation(); $('hd-type').classList.toggle('open'); });
  document.addEventListener('click', e=>{ if(!e.target.closest('#hd-type')) $('hd-type').classList.remove('open'); });
  typePop.addEventListener('click', e=> e.stopPropagation());
  typePop.querySelectorAll('input[type=checkbox]').forEach(cb=> cb.addEventListener('change', ()=>{
    if(cb.checked) FLT.types.add(cb.value); else FLT.types.delete(cb.value);
    hdTypeLabel(); renderAll();
  }));
  $('hd-type-all').addEventListener('click', ()=>{
    TABS.forEach(([,t])=> FLT.types.add(t));
    typePop.querySelectorAll('input[type=checkbox]').forEach(c=> c.checked=true);
    hdTypeLabel(); renderAll();
  });
  $('hd-type-clear').addEventListener('click', ()=>{
    FLT.types.clear();
    typePop.querySelectorAll('input[type=checkbox]').forEach(c=> c.checked=false);
    hdTypeLabel(); renderAll();
  });
  $('hd-start').value = TODAY_S;
  $('hd-end').value = TODAY_S;
  $('hd-start').addEventListener('change', e=>{ FLT.start = e.target.value; if(FLT.end && FLT.start && FLT.start>FLT.end){ FLT.end = FLT.start; $('hd-end').value = FLT.end; } renderAll(); });
  $('hd-end').addEventListener('change', e=>{ FLT.end = e.target.value; if(FLT.start && FLT.end && FLT.end<FLT.start){ FLT.start = FLT.end; $('hd-start').value = FLT.start; } renderAll(); });
  [['done','chart-done'],['recv','chart-recv']].forEach(([k,cid])=>{
    const dimEl = $('dim-'+k);
    if(dimEl) dimEl.addEventListener('change', ()=>{ CARD_DIM[k] = dimEl.value; renderCharts(); if(charts[cid]) charts[cid].resize(); });
    ['a','b'].forEach(side=>{
      const el = $('rg-'+k+'-'+side);
      if(!el) return;
      el.addEventListener('change', ()=>{
        const a = $('rg-'+k+'-a').value, b = $('rg-'+k+'-b').value;
        CARD_RANGES[k] = { start:a, end:b };
        renderCharts();
        if(charts[cid]) charts[cid].resize();
      });
    });
  });
})();
renderAll();
window.addEventListener('resize', ()=> Object.values(charts).forEach(c=> c && c.resize()));
</script>
</body>
</html>
