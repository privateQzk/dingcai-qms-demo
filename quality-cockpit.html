<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>质量数字驾驶舱</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#eef2f7;color:#1e293b;font-family:'Microsoft YaHei','PingFang SC',sans-serif;overflow:hidden;width:100vw;height:100vh}
.dashboard{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;padding:8px 12px 6px;gap:8px}
.header{height:44px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.header::after{content:'';position:absolute;bottom:0;left:5%;right:5%;height:1px;background:linear-gradient(90deg,transparent,rgba(37,99,235,.45),rgba(124,58,237,.35),rgba(37,99,235,.45),transparent)}
.header h1{font-size:22px;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#2563eb,#0891b2,#7c3aed,#0891b2,#2563eb);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .time{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:#2563eb;letter-spacing:1px}
.top-kpi-wrap{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.kpi-filter{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.kpi-filter-label{font-size:11px;color:#64748b;letter-spacing:1px}
.kpi-range-tabs{display:flex;gap:4px}
.kpi-range-tabs span{padding:3px 12px;font-size:11px;color:#64748b;border:1px solid #cbd5e1;border-radius:4px;cursor:pointer;background:#fff}
.kpi-range-tabs span.active{color:#2563eb;border-color:#93c5fd;background:#eff6ff;font-weight:700}
.kpi-date-range{display:flex;align-items:center;gap:6px}
.kpi-date-range input[type="date"]{height:26px;padding:0 8px;font-size:11px;font-family:inherit;color:#334155;background:#fff;border:1px solid #cbd5e1;border-radius:4px;outline:none;color-scheme:light}
.kpi-date-sep{font-size:11px;color:#94a3b8}
.kpi-date-btn{height:26px;padding:0 12px;font-size:11px;font-family:inherit;color:#2563eb;background:#eff6ff;border:1px solid #93c5fd;border-radius:4px;cursor:pointer}
.top-kpi{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.kpi-glow{position:relative;background:#fff;border:1px solid #e2e8f0;border-top:2px solid #cbd5e1;border-radius:8px;padding:8px 6px;text-align:center;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.kpi-label{font-size:11px;color:#64748b;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-num{font-size:21px;font-weight:700;margin-top:2px}
.kpi-unit{font-size:10px;opacity:.6;margin-left:1px}
.kpi-glow.c1 .kpi-num{color:#dc2626}.kpi-glow.c1{border-top-color:#dc2626}
.kpi-glow.c2 .kpi-num{color:#d97706}.kpi-glow.c2{border-top-color:#d97706}
.kpi-glow.c3 .kpi-num{color:#2563eb}.kpi-glow.c3{border-top-color:#2563eb}
.kpi-glow.c4 .kpi-num{color:#ea580c}.kpi-glow.c4{border-top-color:#ea580c}
.kpi-glow.c5 .kpi-num{color:#0891b2}.kpi-glow.c5{border-top-color:#0891b2}
.kpi-glow.c6 .kpi-num{color:#059669}.kpi-glow.c6{border-top-color:#059669}
.kpi-glow.c7 .kpi-num{color:#7c3aed}.kpi-glow.c7{border-top-color:#7c3aed}
.kpi-glow.c8 .kpi-num{color:#db2777}.kpi-glow.c8{border-top-color:#db2777}
.main{flex:1;display:flex;gap:10px;min-height:0}
.col{display:flex;flex-direction:column;gap:8px;min-height:0}
.col-l,.col-r{flex:1}
.col-c{flex:1.35}
.panel{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px;position:relative;display:flex;flex-direction:column;overflow:hidden;min-height:0;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 5%,rgba(59,130,246,.5) 50%,transparent 95%)}
.panel-title{font-size:12px;font-weight:700;color:#2563eb;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:6px;letter-spacing:1px;flex-shrink:0;flex-wrap:wrap}
.panel-title .t-left{display:flex;align-items:center;gap:6px}
.panel-title .t-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.panel-title .t-left::before{content:'';display:inline-block;width:3px;height:12px;background:linear-gradient(180deg,#2563eb,#7c3aed);border-radius:2px}
.panel-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.chart{width:100%;height:100%;flex:1;min-height:0}
.mini-sel{font-size:10px;color:#334155;border:1px solid #e2e8f0;border-radius:5px;background:#fff;padding:2px 4px}
.rg{display:inline-flex;align-items:center;gap:3px;font-weight:400}
.rg input[type="date"]{width:86px;font-size:9px;color:#334155;border:1px solid #e2e8f0;border-radius:5px;background:#fff;padding:1px 3px;font-family:inherit;color-scheme:light}
.rg-sep{font-size:9px;color:#94a3b8}
.rw-wrap{flex:1;min-height:0;display:flex;gap:8px}
.rw-block{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid #e5e9f2;border-radius:8px;overflow:hidden;background:#fff}
.rw-block__t{padding:5px 10px 0;font-size:11px;color:#475569;font-weight:600}
.rw-block .chart{flex:1;min-height:0}
.insp-tabs{display:flex;gap:3px;margin-bottom:6px;flex-shrink:0}
.insp-tabs .insp-tab{flex:1;text-align:center;padding:5px 2px;font-size:10px;color:#64748b;border:1px solid #e2e8f0;border-radius:5px;cursor:pointer;background:#fff}
.insp-tabs .insp-tab.active{color:#2563eb;border-color:#93c5fd;background:#eff6ff;font-weight:700}
.spc-filters{display:flex;gap:4px;margin-bottom:4px;flex-shrink:0}
.spc-filters .mini-sel{flex:1;min-width:0}
.spc-filters input[type="date"].mini-sel{flex:0 0 96px;font-size:9px}
.spc-tilde{color:#94a3b8;font-size:10px;align-self:center}
.spc-box{flex:1;min-height:0;display:flex;flex-direction:column}
.spc-box+.spc-box{border-top:1px dashed #e2e8f0}
.spc-cap{font-size:9px;color:#64748b;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.spc-cap b{font-weight:700;margin-right:6px}
.spc-cap .u{color:#dc2626}.spc-cap .uc{color:#f59e0b}.spc-cap .cc{color:#2563eb}.spc-cap .lc{color:#f59e0b}.spc-cap .l{color:#dc2626}
.empty-tip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<div class="dashboard">
  <div class="header">
    <h1>质量数字驾驶舱</h1>
    <div class="time" id="clock"></div>
  </div>
  <div class="top-kpi-wrap">
    <div class="kpi-filter">
      <span class="kpi-filter-label">统计周期</span>
      <div class="kpi-range-tabs" id="kpi-range">
        <span data-range="month">当月</span>
        <span data-range="quarter">近三个月</span>
        <span data-range="half" class="active">半年</span>
      </div>
      <div class="kpi-date-range">
        <input type="date" id="kpi-date-start">
        <span class="kpi-date-sep">至</span>
        <input type="date" id="kpi-date-end">
        <button type="button" class="kpi-date-btn" id="kpi-date-query">查询</button>
      </div>
    </div>
    <div class="top-kpi">
      <div class="kpi-glow c1"><div class="kpi-label">客诉及抱怨次数</div><div class="kpi-num" id="kpi-crm">0<span class="kpi-unit">次</span></div></div>
      <div class="kpi-glow c3"><div class="kpi-label">交验合格率</div><div class="kpi-num" id="kpi-jy">—<span class="kpi-unit">%</span></div></div>
      <div class="kpi-glow c4"><div class="kpi-label">错、漏检数量</div><div class="kpi-num" id="kpi-miss">0<span class="kpi-unit">项</span></div></div>
      <div class="kpi-glow c5"><div class="kpi-label">品质专项完成率</div><div class="kpi-num" id="kpi-task">—<span class="kpi-unit">%</span></div></div>
      <div class="kpi-glow c7"><div class="kpi-label">巡检问题结案率</div><div class="kpi-num" id="kpi-patrol">—<span class="kpi-unit">%</span></div></div>
      <div class="kpi-glow c8"><div class="kpi-label">纠正预防措施有效性</div><div class="kpi-num" id="kpi-capa">—<span class="kpi-unit">%</span></div></div>
    </div>
  </div>
  <div class="main">
    <div class="col col-l">
      <div class="panel" style="flex:1.2">
        <div class="panel-title"><span class="t-left">检验及时率</span>
          <span class="t-right">
          <select class="mini-sel" id="ot-type">
            <option value="">全部类型</option>
            <option value="tab-pi">采购来料检</option>
            <option value="tab-pp">生产过程检</option>
            <option value="tab-pm">生产物料检</option>
            <option value="tab-sst">生产SST检</option>
            <option value="tab-rd">研发检</option>
            <option value="tab-ext">外来小样检</option>
            <option value="tab-wr">库内复检</option>
            <option value="tab-oe">内部委托</option>
          </select>
          <select class="mini-sel" id="ot-dim">
            <option value="day">日</option>
            <option value="week">周</option>
            <option value="month" selected>月</option>
          </select>
        <span class="rg"><input type="date" id="rg-ot-a"><span class="rg-sep">~</span><input type="date" id="rg-ot-b"></span>
          </span>
        </div>
        <div class="panel-body"><div id="chart-ontime-trend" class="chart"></div></div>
      </div>
      <div class="panel" style="flex:1">
        <div class="panel-title"><span class="t-left">不合格处置统计</span>
          <span class="t-right"><span class="rg"><input type="date" id="rg-rw-a"><span class="rg-sep">~</span><input type="date" id="rg-rw-b"></span></span>
        </div>
        <div class="panel-body">
          <div class="rw-wrap">
            <div class="rw-block"><div class="rw-block__t">按问题大类统计</div><div class="chart" id="chart-rw-cat"></div></div>
            <div class="rw-block"><div class="rw-block__t">按处置方式统计</div><div class="chart" id="chart-rw-way"></div></div>
          </div>
        </div>
      </div>
    </div>
    <div class="col col-c">
      <div class="panel" style="flex:1">
        <div class="panel-title"><span class="t-left">合格率趋势</span>
          <span class="t-right">
          <select class="mini-sel" id="trend-dim">
            <option value="day">日</option>
            <option value="week">周</option>
            <option value="month" selected>月</option>
          </select>
          <span class="rg"><input type="date" id="rg-trend-a"><span class="rg-sep">~</span><input type="date" id="rg-trend-b"></span>
          </span>
        </div>
        <div class="panel-body"><div id="chart-rate-trend" class="chart"></div></div>
      </div>
      <div class="panel" style="flex:1">
        <div class="panel-title"><span class="t-left">客诉及抱怨趋势</span>
          <span class="t-right"><span class="rg"><input type="date" id="rg-crm-a"><span class="rg-sep">~</span><input type="date" id="rg-crm-b"></span></span>
        </div>
        <div class="panel-body"><div id="chart-crm-trend" class="chart"></div></div>
      </div>
    </div>
    <div class="col col-r">
      <div class="panel" style="flex:1.2">
        <div class="panel-title"><span class="t-left">SPC分析</span>
        </div>
        <div class="panel-body">
          <div class="insp-tabs" id="spc-tabs">
            <div class="insp-tab active" data-spc="pi">采购来料</div>
            <div class="insp-tab" data-spc="pp">生产过程</div>
            <div class="insp-tab" data-spc="pm">生产物料</div>
          </div>
          <div class="spc-filters">
            <select class="mini-sel" id="spc-mat" title="物料信息 *必填"></select>
            <select class="mini-sel" id="spc-plan" title="检验方案 *必填"></select>
            <select class="mini-sel" id="spc-item" title="检验项 *必填"></select>
            <select class="mini-sel" id="spc-point" title="采样点"></select>
          </div>
          <div class="spc-filters">
            <input class="mini-sel" id="spc-d1" type="date" title="时间范围 *必填"><span class="spc-tilde">~</span><input class="mini-sel" id="spc-d2" type="date">
          </div>
          <div class="spc-box"><div class="spc-cap" id="spc-cap1"></div><div id="chart-spc-i" class="chart"></div></div>
          <div class="spc-box"><div class="spc-cap" id="spc-cap2"></div><div id="chart-spc-cpk" class="chart"></div></div>
        </div>
      </div>
      <div class="panel" style="flex:1">
        <div class="panel-title"><span class="t-left">检测成本统计</span>
          <span class="t-right"><span class="rg"><input type="date" id="rg-cost-a"><span class="rg-sep">~</span><input type="date" id="rg-cost-b"></span></span>
        </div>
        <div class="panel-body"><div id="chart-cost" class="chart"></div></div>
      </div>
    </div>
  </div>
</div>
<script src="./js/mock-rows.js?v=1.4.367"></script>
<script src="./js/demo-store.js?v=1.0.173"></script>
<script src="./js/ledger-insp.js?v=4"></script>
<script>
const MOCK = window.WMS_MOCK_ROWS || {};
try{ if(window.WMS_DEMO_STORE && window.WMS_DEMO_STORE.hydrateMock) window.WMS_DEMO_STORE.hydrateMock(MOCK); }catch(e){}
const ORDER_TABS = [
  ['tab-pi','采购来料检','pi'],
  ['tab-pp','生产过程检','pp'],
  ['tab-pm','生产物料检','pm'],
  ['tab-rd','研发检','rd'],
  ['tab-sst','生产SST检','sst']
];
const CATE_LABEL = {pi:'采购来料检', pp:'生产过程检', pm:'生产物料检', rd:'研发检', sst:'生产SST检'};
const CATE_ORDER = ['pi','pp','pm','rd','sst'];
const CLOSED = {已完成:1, 已关闭:1, 已通过:1, 已驳回:1};
let orders = [];

function pad2(n){ return String(n).padStart(2,'0'); }
function toDateStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function dayOf(v){
  const s = String(v||'').trim();
  const m = s.match(/^(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : '';
}
function inRange(v, start, end){
  const d = dayOf(v);
  return !!(d && start && end && d>=start && d<=end);
}
function hasEta(v){ return !!(v && v!=='—' && v!=='-' && dayOf(v)); }
function isOverdue(eta){
  if(!hasEta(eta)) return false;
  const t = Date.parse(String(eta).replace(/-/g,'/'));
  return !isNaN(t) && Date.now() > t;
}
function esc(v){
  return String(v==null || v==='' ? '—' : v).replace(/[&<>"]/g, function(s){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s];
  });
}
function fmt(n){ return Number(n||0).toLocaleString('zh-CN'); }
function pctStr(n, d){ return n==null ? '—' : (Math.round(n*100)/100).toFixed(d==null?1:d)+'%'; }
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function rowsOf(pageId, tabs){
  const bag = MOCK[pageId] || {};
  const out = [];
  (tabs || Object.keys(bag)).forEach(function(tab){
    const arr = bag[tab];
    if(!Array.isArray(arr)) return;
    arr.forEach(function(r){ if(r && typeof r==='object') out.push(Object.assign({_tab:tab}, r)); });
  });
  return out;
}
function sampleDay(r){ return dayOf(r['检验完成时间']) || dayOf(r['报检时间']); }
function isDoneSample(r){ return r['样品状态']==='已完成' && (r['检验结论']==='合格' || r['检验结论']==='不合格'); }
function isBadSample(r){ return r['检验结论']==='不合格'; }
function ledgerByCate(cate){
  const tabs = ORDER_TABS.filter(function(t){ return t[2]===cate; }).map(function(t){ return t[0]; });
  return rowsOf('ledger', tabs);
}
function inspItems(r){
  const all = window.WMS_LEDGER_INSP ? WMS_LEDGER_INSP.ledgerInspItems(r) : (Array.isArray(r._insp) ? r._insp : []);
  return Array.isArray(all) ? all : [];
}
function rateInfo(rows){
  const done = rows.filter(isDoneSample);
  if(!done.length) return null;
  const pass = done.filter(function(r){ return r['检验结论']==='合格'; }).length;
  return { rate: Math.round(pass / done.length * 1000) / 10, pass: pass, done: done.length };
}
function rateOf(rows){
  const i = rateInfo(rows);
  return i ? i.rate : null;
}
function monthKeys(start, end){
  const out = [];
  if(!start || !end) return out;
  let y = +start.slice(0,4), m = +start.slice(5,7);
  const ey = +end.slice(0,4), em = +end.slice(5,7);
  while(y<ey || (y===ey && m<=em)){
    out.push(y+'-'+pad2(m));
    m += 1;
    if(m>12){ m = 1; y += 1; }
  }
  return out;
}
function inMonth(v, ym){ return dayOf(v).slice(0,7)===ym; }
function period(){
  return {
    start: document.getElementById('kpi-date-start').value,
    end: document.getElementById('kpi-date-end').value
  };
}
const CARD_RANGES = {ot:{}, trend:{}, rw:{}, crm:{}, cost:{}};
function periodOf(key){
  const r = CARD_RANGES[key] || {};
  if(r.start && r.end) return {start:r.start, end:r.end};
  return period();
}
function syncCardRanges(){
  const p = period();
  Object.keys(CARD_RANGES).forEach(function(k){
    CARD_RANGES[k] = {start:p.start, end:p.end};
    const a = document.getElementById('rg-'+k+'-a'), b = document.getElementById('rg-'+k+'-b');
    if(a) a.value = p.start;
    if(b) b.value = p.end;
  });
}
function loadOrders(){
  const map = {};
  ORDER_TABS.forEach(function(t){ map[t[0]] = {label:t[1], cate:t[2]}; });
  return rowsOf('insp-order', ORDER_TABS.map(function(t){ return t[0]; })).map(function(r){
    const meta = map[r._tab] || {label:r._tab, cate:'rd'};
    return Object.assign({}, r, {_type: meta.label, _cate: meta.cate});
  });
}
function rangedOrders(){
  const p = period();
  return orders.filter(function(r){ return inRange(r['报检时间'], p.start, p.end); });
}

/* ---------- KPI：客诉及抱怨 ---------- */
function crmRows(pageId, dateKey){
  const p = period();
  return rowsOf(pageId, ['tab-1','tab-2']).filter(function(r){ return inRange(r[dateKey], p.start, p.end); });
}
/* ---------- KPI：检测成本（标准系数合计） ---------- */
function costRules(){
  return rowsOf('np-0103-14').filter(function(r){ return r['启用状态']!=='停用'; });
}
function costRuleFor(cat, matCode){
  const rules = costRules().filter(function(r){ return String(r['检验类']||'').trim()===cat; });
  if(!rules.length) return null;
  const hit = rules.find(function(r){ return r['物料编码'] && String(r['物料编码'])===String(matCode||''); });
  return hit || rules.find(function(r){ return !r['物料编码'] || r['匹配范围']==='全部'; }) || rules[0];
}
function costFlows(p){
  p = p || period();
  const out = [];
  CATE_ORDER.forEach(function(k){
    ledgerByCate(k).forEach(function(r){
      if(!isDoneSample(r) || !inRange(sampleDay(r), p.start, p.end)) return;
      const cats = {};
      inspItems(r).forEach(function(it){
        const c = String(it['所属检验类']||'').trim();
        if(c && c!=='—') cats[c] = 1;
      });
      const catList = Object.keys(cats);
      (catList.length ? catList : [r['检验类型'] || '其他']).forEach(function(cat){
        const rule = costRuleFor(cat, r['物料编码']);
        out.push({ cat:cat, coeff: rule ? num(rule['标准系数']) : 0, type:k });
      });
    });
  });
  return out;
}
/* ---------- KPI：交验合格率（批次复核合格占比） ---------- */
function batchRate(rows){
  const done = rows.filter(function(r){ return CLOSED[r['单据状态']] && (r['复核结论']==='合格' || r['复核结论']==='不合格'); });
  if(!done.length) return null;
  return Math.round(done.filter(function(r){ return r['复核结论']==='合格'; }).length / done.length * 1000) / 10;
}
/* ---------- KPI：错漏检 ---------- */
function missCount(){
  const p = period();
  return rowsOf('np-0417-03').filter(function(r){
    return ['数据异常','检验结果异常'].indexOf(r['异常类型'])>=0 && inRange(r['发生时间'], p.start, p.end);
  }).length;
}
/* ---------- KPI：品质专项完成率 ---------- */
function taskRate(){
  const p = period();
  const rows = rowsOf('np-0218-01').filter(function(r){ return inRange(dayOf(r['计划完成时间']) || r['创建时间'], p.start, p.end); });
  if(!rows.length) return null;
  const done = rows.filter(function(r){ return r['任务状态']==='已完成' || r._tab==='tab-2'; }).length;
  return Math.round(done / rows.length * 1000) / 10;
}
/* ---------- KPI：检验及时率（样品级：检验完成时间 ≤ 报检单预计完成时间） ---------- */
let orderEtaMap = null;
function etaOfSample(r){
  if(orderEtaMap==null){
    orderEtaMap = {};
    orders.forEach(function(o){ if(o['报检单号'] && hasEta(o['预计完成时间'])) orderEtaMap[o['报检单号']] = o['预计完成时间']; });
  }
  return orderEtaMap[r['报检单号']] || '';
}
/* ---------- KPI：巡检问题结案率 ---------- */
function patrolStat(){
  const p = period();
  const done = rowsOf('np-0408-02', ['tab-2']).filter(function(r){ return inRange(dayOf(r['计划结束时间']) || r['计划开始时间'], p.start, p.end); });
  const bad = done.filter(function(r){ return r['检查结果']==='异常' && r['计划状态']!=='已关闭'; });
  if(!bad.length) return {rate:null, bad:0, closed:0};
  const closed = bad.filter(function(r){ return r['计划状态']==='已完成'; }).length;
  return {rate: Math.round(closed / bad.length * 1000) / 10, bad: bad.length, closed: closed};
}
/* ---------- KPI：CAPA有效性 ---------- */
function capaRate(){
  const p = period();
  const rows = rowsOf('capa-handle', ['tab-done']).filter(function(r){ return inRange(r['整改完成时间'], p.start, p.end); });
  if(!rows.length) return null;
  const ok = rows.filter(function(r){ return String(r['整改说明']||'').indexOf('有效')>=0; }).length;
  return Math.round(ok / rows.length * 1000) / 10;
}
/* ---------- 返工与处置 ---------- */
function unqualRows(){
  const p = periodOf('rw');
  const out = [];
  ['unqual-pi','unqual-pp','unqual-pm','unqual-rd'].forEach(function(id){
    rowsOf(id, ['tab-done']).forEach(function(r){
      if(inRange(r['复核时间'], p.start, p.end)) out.push(r);
    });
  });
  return out;
}
/* ---------- SPC分析：类型页签 + 级联筛选 + I图/CPK趋势 ---------- */
let spcType = 'pi';
const spcSel = {mat:'', plan:'', item:'', point:''};
const spcCache = {};
function spcEntries(){
  if(spcCache[spcType]) return spcCache[spcType];
  const out = [];
  ledgerByCate(spcType).forEach(function(r){
    inspItems(r).forEach(function(it){
      const v = parseFloat(it['检验结果值'] || it['检验报出值']);
      if(isNaN(v)) return;
      out.push({r:r, it:it, v:v, day:sampleDay(r)});
    });
  });
  spcCache[spcType] = out;
  return out;
}
function pickBest(es, fn){
  const cnt = {};
  es.forEach(function(e){ const k = fn(e); if(k) cnt[k] = (cnt[k]||0)+1; });
  return Object.keys(cnt).sort(function(a,b){ return cnt[b]-cnt[a]; })[0] || '';
}
function fillSel(id, values, label, def){
  const el = document.getElementById(id);
  const cur = el.value;
  el.innerHTML = '<option value="">'+label+'</option>' + values.map(function(v){ return '<option>'+esc(v)+'</option>'; }).join('');
  el.value = values.indexOf(cur)>=0 ? cur : (def || '');
  return el.value;
}
function spcCascade(){
  const es = spcEntries();
  const mats = [...new Set(es.map(function(e){ return e.r['物料名称']; }).filter(Boolean))].sort();
  spcSel.mat = fillSel('spc-mat', mats, '物料信息 *', spcSel.mat || pickBest(es, function(e){ return e.r['物料名称']; }));
  const m1 = es.filter(function(e){ return !spcSel.mat || e.r['物料名称']===spcSel.mat; });
  const plans = [...new Set(m1.map(function(e){ return e.r['检验方案']; }).filter(function(v){ return v && v!=='—'; }))].sort();
  spcSel.plan = fillSel('spc-plan', plans, '检验方案 *', spcSel.plan || pickBest(m1, function(e){ return e.r['检验方案']; }));
  const m2 = m1.filter(function(e){ return !spcSel.plan || e.r['检验方案']===spcSel.plan; });
  const items = [...new Set(m2.map(function(e){ return e.it['检验项名称']; }).filter(Boolean))].sort();
  spcSel.item = fillSel('spc-item', items, '检验项 *', spcSel.item || pickBest(m2, function(e){ return e.it['检验项名称']; }));
  const m3 = m2.filter(function(e){ return !spcSel.item || e.it['检验项名称']===spcSel.item; });
  const points = [...new Set(m3.map(function(e){ return e.r['采样点']; }).filter(function(v){ return v && v!=='—'; }))].sort();
  spcSel.point = fillSel('spc-point', points, '全部采样点', spcSel.point);
}
function limOf(es, key){
  const f = es.find(function(e){ const x = parseFloat(e.it[key]); return !isNaN(x); });
  return f ? parseFloat(f.it[key]) : null;
}
function renderSpc(){
  spcCascade();
  const p = period();
  const d1 = document.getElementById('spc-d1').value || p.start;
  const d2 = document.getElementById('spc-d2').value || p.end;
  const es = spcEntries().filter(function(e){
    if(spcSel.mat && e.r['物料名称']!==spcSel.mat) return false;
    if(spcSel.plan && e.r['检验方案']!==spcSel.plan) return false;
    if(spcSel.item && e.it['检验项名称']!==spcSel.item) return false;
    if(spcSel.point && e.r['采样点']!==spcSel.point) return false;
    return inRange(e.day, d1, d2);
  }).sort(function(a,b){ return a.day<b.day ? -1 : 1; });
  const c1 = chart('chart-spc-i'), c2 = chart('chart-spc-cpk');
  const title = (spcSel.mat||'全部物料') + ' · ' + (spcSel.item||'全部检验项');
  if(!es.length){
    document.getElementById('spc-cap1').innerHTML = '';
    document.getElementById('spc-cap2').innerHTML = '';
    emptyChart(c1, '当前周期暂无定量数据'); emptyChart(c2, '当前周期暂无定量数据');
    return;
  }
  /* 样本不足 12 个批次时，用确定性仿真批次补齐，保证控制图形态可演示 */
  const spcHash = function(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); };
  if(es.length < 12){
    const base = es.map(function(e){ return e.v; });
    const bm = base.reduce(function(s,v){ return s+v; },0)/base.length;
    const bsd = Math.sqrt(base.reduce(function(s,v){ return s+(v-bm)*(v-bm); },0)/base.length) || 0.05;
    const pad = 12 - es.length;
    for(let i=0;i<pad;i++){
      const h = spcHash((spcSel.mat||'m')+(spcSel.item||'i')+'|demo'+i);
      const j = (((h%97)/97)-0.5)*2*1.6;
      es.push({r:{'报检批号':'DEMO-B'+pad2(i+1)}, it:es[0].it, v:+(bm+bsd*j).toFixed(3), day:'', _demo:true});
    }
  }
  const batchOf = function(e, i){ return e.r['报检批号'] || e.r['样品编号'] || ('批'+(i+1)); };
  const labels = es.map(function(e,i){ return batchOf(e,i); });
  const vals = es.map(function(e){ return e.v; });
  const mean = vals.reduce(function(s,v){ return s+v; },0)/vals.length;
  const sd = Math.sqrt(vals.reduce(function(s,v){ return s+(v-mean)*(v-mean); },0)/vals.length) || 0.001;
  const lim = {USL:limOf(es,'USL'), UCL:limOf(es,'UCL'), LCL:limOf(es,'LCL'), LSL:limOf(es,'LSL')};
  if(lim.UCL==null) lim.UCL = Math.round((mean+3*sd)*100)/100;
  if(lim.LCL==null) lim.LCL = Math.round((mean-3*sd)*100)/100;
  const limTxt = [['USL','u'],['UCL','uc'],['CL','cc'],['LCL','lc'],['LSL','l']].map(function(kv){
    const v = kv[0]==='CL' ? Math.round(mean*100)/100 : lim[kv[0]];
    return v==null ? '' : '<span class="'+kv[1]+'">'+kv[0]+' '+v+'</span>';
  }).filter(Boolean).join(' ');
  document.getElementById('spc-cap1').innerHTML = '<b>'+esc(title)+' · I图</b>'+limTxt;
  const markLines = [['UCL','#f59e0b'],['CL','#2563eb'],['LCL','#f59e0b'],['USL','#dc2626'],['LSL','#dc2626']].map(function(kv){
    const v = kv[0]==='CL' ? mean : lim[kv[0]];
    return v==null ? null : {yAxis:v, lineStyle:{color:kv[1], width:1.5, type:kv[0]==='CL'?'solid':'dashed'}, label:{formatter:kv[0], fontSize:8, color:kv[1], position:'insideEndTop'}};
  }).filter(Boolean);
  if(c1) c1.setOption({
    tooltip:Object.assign({trigger:'axis'}, tip),
    grid:{left:4, right:36, top:8, bottom:2, containLabel:true},
    xAxis:Object.assign({type:'category', data:labels, boundaryGap:false, axisTick:{show:false},
      axisLabel:Object.assign({rotate:38}, ax.axisLabel)}, ax),
    yAxis:Object.assign({type:'value', scale:true}, ay),
    series:[{type:'line', smooth:true, symbol:'circle', symbolSize:5, data:vals,
      lineStyle:{width:2, color:'#22d3ee'}, itemStyle:{color:'#22d3ee'},
      markLine:{silent:true, symbol:'none', data:markLines}}]
  }, true);
  /* CPK趋势：每个批次一个点，取最近 8 个样本滚动计算 min(CPU,CPL)（≥4 样本出点，单边按有值一侧），目标线1.33 */
  const usl = lim.USL, lsl = lim.LSL;
  const cpkVals = [], cpkNames = [];
  for(let i=0;i<es.length;i++){
    const win = es.slice(Math.max(0,i-7), i+1);
    if(win.length < 4 || (usl==null && lsl==null)){ cpkVals.push(null); cpkNames.push(batchOf(es[i],i)); continue; }
    const sv = win.map(function(e){ return e.v; });
    const m = sv.reduce(function(a,b){ return a+b; },0)/sv.length;
    const s2 = Math.sqrt(sv.reduce(function(a,b){ return a+(b-m)*(b-m); },0)/(sv.length-1)) || 0.001;
    const cpu = usl==null ? Infinity : (usl-m)/(3*s2);
    const cpl = lsl==null ? Infinity : (m-lsl)/(3*s2);
    cpkVals.push(+(Math.min(cpu,cpl)).toFixed(3));
    cpkNames.push(batchOf(es[i],i));
  }
  document.getElementById('spc-cap2').innerHTML = '<b>'+esc(title)+' · CPK趋势图</b><span class="uc">目标 CPK 1.33</span>';
  if(c2){
    if(!cpkVals.some(function(v){ return v!=null; })){ emptyChart(c2, '当前筛选暂无规格限，无法计算CPK'); }
    else c2.setOption({
      tooltip:Object.assign({trigger:'axis'}, tip),
      grid:{left:4, right:36, top:8, bottom:2, containLabel:true},
      xAxis:Object.assign({type:'category', data:cpkNames, boundaryGap:false, axisTick:{show:false},
        axisLabel:Object.assign({rotate:38}, ax.axisLabel)}, ax),
      yAxis:Object.assign({type:'value'}, ay),
      series:[{type:'line', smooth:true, symbol:'circle', symbolSize:5, connectNulls:true, data:cpkVals.map(function(v){ return {value:v, itemStyle:{color:v!=null&&v<1.33?'#dc2626':'#1f2937'}}; }),
        lineStyle:{width:2, color:'#38bdf8'}, itemStyle:{color:'#38bdf8'},
        markLine:{silent:true, symbol:'none', data:[{yAxis:1.33, lineStyle:{color:'#f59e0b', width:1.5, type:'dashed'}, label:{formatter:'目标 1.33', fontSize:8, color:'#f59e0b', position:'insideEndTop'}}]}}]
    }, true);
  }
}

let trendDim = 'month';
function trendBuckets(start, end, dim){
  dim = dim || trendDim;
  const out = [];
  if(!start || !end) return out;
  if(dim==='day'){
    const d = new Date(start.replace(/-/g,'/')), e = new Date(end.replace(/-/g,'/'));
    while(d<=e){
      const k = toDateStr(d);
      out.push({label:k.slice(5), key:k, test:(function(kk){ return function(dy){ return dy===kk; }; })(k)});
      d.setDate(d.getDate()+1);
    }
    return out;
  }
  if(dim==='week'){
    const d = new Date(start.replace(/-/g,'/')), e = new Date(end.replace(/-/g,'/'));
    d.setDate(d.getDate() - ((d.getDay()+6)%7));
    while(d<=e){
      const k = toDateStr(d);
      out.push({label:k.slice(5)+'周', key:k, test:(function(kk){ return function(dy){
        const dd = Date.parse(dy.replace(/-/g,'/')), kk2 = Date.parse(kk.replace(/-/g,'/'));
        return dd>=kk2 && dd<kk2+7*86400000;
      }; })(k)});
      d.setDate(d.getDate()+7);
    }
    return out;
  }
  monthKeys(start, end).forEach(function(ym){
    out.push({label:ym.slice(2).replace('-','/'), key:ym, test:(function(kk){ return function(dy){ return (dy||'').slice(0,7)===kk; }; })(ym)});
  });
  return out;
}

  }

    {name:'IQC', color:'#2563eb', data:buckets.map(function(b){ return ledgerBucketRate('pi', b.test); })},

    {name:'FQC', color:'#7c3aed', data:buckets.map(function(b){ return ledgerBucketRate('pm', b.test); })}
  ];
  if(!series.some(function(s){ return s.data.some(function(v){ return v!=null; }); })){ emptyChart(c, '当前周期暂无已完成数据'); return; }

    tooltip:Object.assign({trigger:'axis'}, tip),

    xAxis:Object.assign({type:'category', data:buckets.map(function(b){ return b.label; }), boundaryGap:false, axisTick:{show:false}}, ax),
    yAxis:Object.assign({type:'value', min:60, max:100, axisLabel:Object.assign({formatter:'{value}%'}, ay.axisLabel)}, ay),
    dataZoom: buckets.length>24 ? [{type:'slider', height:14, bottom:4}] : [],

      return {name:s.name, type:'line', smooth:true, connectNulls:false, symbol:'circle', symbolSize:4,
        data:s.data, lineStyle:{width:2, color:s.color}, itemStyle:{color:s.color},

function renderCost(){
  const flows = costFlows(periodOf('cost'));
  const byCat = {};
  flows.forEach(function(f){ byCat[f.cat] = (byCat[f.cat]||0)+f.coeff; });
  const pairs = Object.keys(byCat).map(function(k){ return [k, Math.round(byCat[k]*100)/100]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,7);
  const c = chart('chart-cost');
  if(!c) return;
  if(!pairs.length){ emptyChart(c, '当前周期暂无成本流水'); return; }
  const sum = pairs.reduce(function(s,p){ return s+p[1]; },0) || 1;
  c.setOption({
    tooltip:Object.assign({trigger:'axis', axisPointer:{type:'shadow'},
      formatter:function(ps){ const p=ps[0]; return p.name+'<br>标准系数：'+p.value+'（'+Math.round(p.value/sum*1000)/10+'%）'; }}, tip),
    grid:{left:4, right:44, top:8, bottom:2, containLabel:true},
    xAxis:Object.assign({type:'value'}, ay),
    yAxis:Object.assign({type:'category', data:pairs.map(function(p){ return p[0]; }).reverse(), axisTick:{show:false}}, ax),
    series:[{type:'bar', barWidth:12, data:pairs.map(function(p){ return p[1]; }).reverse(),
      itemStyle:{color:'#38bdf8', borderRadius:[0,3,3,0]},
      label:{show:true, position:'right', color:'#64748b', fontSize:9,
        formatter:function(p){ return p.value+' · '+Math.round(p.value/sum*1000)/10+'%'; }}}]
  }, true);
}

function refresh(){
  orders = loadOrders();
  orderEtaMap = null;
  syncCardRanges();
  const pp0 = period();
  document.getElementById('spc-d1').value = pp0.start;
  document.getElementById('spc-d2').value = pp0.end;
  const cmp = crmRows('np-0212-02','投诉日期'), grv = crmRows('np-0212-01','抱怨日期');
  setKpiNum('kpi-crm', cmp.length + grv.length, '次');
  setKpiNum('kpi-jy', batchRate(rangedOrders()), '%', true);
  setKpiNum('kpi-miss', missCount(), '项');
  setKpiNum('kpi-task', taskRate(), '%', true);
  const patrol = patrolStat();
  setKpiNum('kpi-patrol', patrol.rate, '%', true);
  setKpiNum('kpi-capa', capaRate(), '%', true);
  renderOntime();
  renderDispose();
  renderTrend();
  renderCrmTrend();
  renderSpc();
  renderCost();
  Object.keys(charts).forEach(function(id){ charts[id].resize(); });
}

/* ---------- 周期与初始化 ---------- */
function applyRange(key){
  const now = new Date();
  const end = toDateStr(now);
  let start;
  if(key==='month') start = now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-01';
  else if(key==='quarter'){ const d = new Date(now); d.setMonth(d.getMonth()-2); start = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-01'; }
  else { const d = new Date(now); d.setMonth(d.getMonth()-5); start = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-01'; }
  document.getElementById('kpi-date-start').value = start;
  document.getElementById('kpi-date-end').value = end;
  refresh();
}
function tickClock(){
  const d = new Date();
  document.getElementById('clock').textContent =
    d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());
}
document.querySelectorAll('#kpi-range span').forEach(function(el){
  el.addEventListener('click', function(){
    document.querySelectorAll('#kpi-range span').forEach(function(x){ x.classList.remove('active'); });
    el.classList.add('active');
    applyRange(el.dataset.range);
  });
});
document.querySelectorAll('#spc-tabs .insp-tab').forEach(function(el){
  el.addEventListener('click', function(){
    document.querySelectorAll('#spc-tabs .insp-tab').forEach(function(x){ x.classList.remove('active'); });
    el.classList.add('active');
    spcType = el.dataset.spc;
    spcSel.mat = spcSel.plan = spcSel.item = spcSel.point = '';
    renderSpc();
  });
});
['spc-mat','spc-plan','spc-item','spc-point','spc-d1','spc-d2'].forEach(function(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('change', function(){
    if(id==='spc-mat'){ spcSel.plan=''; spcSel.item=''; spcSel.point=''; spcSel.mat = el.value; }
    else if(id==='spc-plan'){ spcSel.item=''; spcSel.point=''; spcSel.plan = el.value; }
    else if(id==='spc-item'){ spcSel.point=''; spcSel.item = el.value; }
    else if(id==='spc-point'){ spcSel.point = el.value; }
    renderSpc();
  });
});
document.getElementById('trend-dim').addEventListener('change', function(){
  trendDim = this.value;
  renderTrend();
  if(charts['chart-rate-trend']) charts['chart-rate-trend'].resize();
});
document.getElementById('ot-type').addEventListener('change', function(){
  otType = this.value;
  renderOntime();
  if(charts['chart-ontime-trend']) charts['chart-ontime-trend'].resize();
});
document.getElementById('ot-dim').addEventListener('change', function(){
  otDim = this.value;
  renderOntime();
  if(charts['chart-ontime-trend']) charts['chart-ontime-trend'].resize();
});
const CARD_RENDER = {ot:'chart-ontime-trend', trend:'chart-rate-trend', rw:null, crm:'chart-crm-trend', cost:'chart-cost'};
const CARD_FN = {ot:renderOntime, trend:renderTrend, rw:renderDispose, crm:renderCrmTrend, cost:renderCost};
['ot','trend','rw','crm','cost'].forEach(function(k){
  ['a','b'].forEach(function(side){
    const el = document.getElementById('rg-'+k+'-'+side);
    if(!el) return;
    el.addEventListener('change', function(){
      const a = document.getElementById('rg-'+k+'-a').value, b = document.getElementById('rg-'+k+'-b').value;
      CARD_RANGES[k] = {start:a, end:b};
      CARD_FN[k]();
      const cid = CARD_RENDER[k];
      if(cid && charts[cid]) charts[cid].resize();
    });
  });
});
document.getElementById('kpi-date-query').addEventListener('click', function(){
  document.querySelectorAll('#kpi-range span').forEach(function(x){ x.classList.remove('active'); });
  refresh();
});
window.addEventListener('resize', function(){
  Object.keys(charts).forEach(function(id){ charts[id].resize(); });
});
tickClock();
setInterval(tickClock, 1000);
applyRange('half');
</script>
</body>
